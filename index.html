<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0C0B0B; --card:#161313; --card2:#110F0F; --line:#241F1F; --line2:#332C2C;
    --tx:#F0EDE6; --tx2:#B5ADA7; --mut:#7A716B; --dim:#4A4341;
    --a:#FF4FA3; --on:#46D08A; --warn:#F5A524; --stop:#FF5A47;
    color-scheme: dark;
  }
  body.ph3 { --a:#5EEAD4; }
  body {
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px; max-width:480px; margin:0 auto;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 60px);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .mono { font-family:'SF Mono',ui-monospace,'Roboto Mono',monospace; font-variant-numeric:tabular-nums; }
  .anton { font-family:'Anton','Haettenschweiler','Arial Narrow',sans-serif; font-weight:400; letter-spacing:.5px; }

  /* ---- masthead: the bib ---- */
  .mast { border:1px solid var(--line2); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .mast .top { padding:14px 16px 12px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .wordmark { font-size:38px; line-height:.88; transform:skewX(11deg); transform-origin:left bottom;
              text-transform:uppercase; color:var(--tx); }
  .mast .wk { text-align:right; flex-shrink:0; }
  .mast .wk .n { font-size:34px; line-height:.9; color:var(--a); }
  .mast .wk .d { font-size:9.5px; letter-spacing:1.4px; color:var(--mut); margin-top:4px; }
  .strip { background:var(--a); color:#0C0B0B; padding:7px 16px; display:flex; justify-content:space-between;
           align-items:center; font-size:10px; font-weight:700; letter-spacing:1.6px; }
  .strip .r { opacity:.72; }

  /* ---- fuel bar ---- */
  .fuel { display:flex; gap:8px; margin-bottom:12px; }
  .fuel > div { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  .fuel .lab { font-size:8.5px; letter-spacing:1.4px; color:var(--mut); font-weight:700; margin-bottom:3px; }
  .fuel .v { font-size:15px; color:var(--a); }
  .fuel .s { font-size:10.5px; color:var(--tx2); margin-top:2px; }

  /* ---- week dots ---- */
  .dots { display:flex; gap:5px; overflow-x:auto; padding-bottom:5px; margin-bottom:12px; scrollbar-width:none; }
  .dots::-webkit-scrollbar { display:none; }
  .dots button { min-width:34px; height:34px; flex-shrink:0; border-radius:8px; border:1px solid var(--line2);
                 background:var(--card); color:var(--mut); font-size:12px; font-weight:700; }
  .dots button.has { color:var(--a); border-color:color-mix(in srgb, var(--a) 45%, transparent); }
  .dots button.on { background:var(--a); color:#0C0B0B; border-color:var(--a); }

  .focus { border-left:3px solid var(--a); border-radius:0 10px 10px 0; padding:11px 14px; margin-bottom:16px;
           font-size:12.5px; line-height:1.6; color:var(--tx2);
           background:linear-gradient(100deg, color-mix(in srgb, var(--a) 9%, transparent), transparent 70%); }

  /* ---- tabs ---- */
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tabs button { flex:1; padding:10px 0 8px; background:none; border:none; color:#5B5350;
                 font-size:10px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase;
                 border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--tx); border-bottom-color:var(--a); }

  /* ---- cards ---- */
  .card { background:var(--card); border-radius:12px; padding:13px 15px; margin-bottom:10px;
          border-left:3px solid var(--line2); }
  .card.done { border-left-color:var(--a); }
  .card.key { border-left-color:var(--a); }
  .slab { font-size:9.5px; letter-spacing:1.5px; color:var(--mut); font-weight:700; margin-bottom:7px; }
  .card.done .slab { color:var(--a); }
  .plan { font-size:13.5px; line-height:1.6; }
  .sub { font-size:11px; color:var(--mut); line-height:1.5; margin-bottom:6px; }
  .ttl { font-size:15px; font-weight:700; margin-bottom:5px; }

  input, textarea, select { width:100%; background:var(--bg); border:1px solid var(--line2); border-radius:8px;
          color:var(--tx); padding:10px 11px; font-size:16px; font-family:inherit; margin-top:7px;
          -webkit-appearance:none; appearance:none; }

  .liftrow { display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:12.5px;
             border-bottom:1px solid var(--line); }
  .liftrow:last-child { border-bottom:none; }
  .liftrow .n { color:var(--tx2); }
  .liftrow .s { font-size:11px; color:var(--a); text-align:right; max-width:52%; flex-shrink:0; }
  .liftrow .alt { display:block; font-size:11px; color:var(--mut); margin-top:2px; }

             border:1px solid var(--a); border-radius:3px; padding:1px 3px; margin-left:6px; vertical-align:2px; }

  details { margin-bottom:9px; }
  summary { list-style:none; background:var(--card); border-radius:10px; padding:12px 15px;
            border:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }

  .dbody { background:var(--card2); border-radius:0 0 10px 10px; padding:4px 15px 10px;

  .daytag { font-size:9.5px; color:var(--a); font-weight:700; letter-spacing:1.2px; margin-right:10px; }

  .btn { display:block; width:100%; padding:13px; border-radius:10px; border:1px solid var(--line2);

  .btn.primary { background:var(--a); color:#0C0B0B; border-color:var(--a); }

  .trend { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:12px; }
  .trow { display:flex; justify-content:space-between; font-size:12px; padding:4px 0; color:var(--tx2); }
  .trow .delta { font-size:11px; }
  .dn { color:var(--on); } .up { color:var(--warn); } .fast { color:var(--stop); }

  .rule { display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); }
  .rule:last-child { border-bottom:none; }
  .rule .num { font-size:17px; color:var(--a); line-height:1; flex-shrink:0; width:24px; }
  .rule .txt { font-size:12.5px; line-height:1.62; color:var(--tx2); }
  .rule .txt b { color:var(--tx); font-weight:700; }

  .wire { display:flex; gap:10px; align-items:flex-start; padding:9px 0; font-size:12.5px;
          line-height:1.55; color:var(--tx2); border-bottom:1px solid var(--line); }
  .wire:last-child { border-bottom:none; }
  .wire::before { content:''; width:7px; height:7px; border-radius:2px; background:var(--stop);
                  flex-shrink:0; margin-top:6px; }

  .gate { border:1px solid var(--a); border-left-width:3px; border-radius:12px; padding:13px 15px; margin-bottom:10px;
          background:linear-gradient(100deg, color-mix(in srgb, var(--a) 8%, transparent), transparent 70%); }
  .gate ol { margin:8px 0 0 18px; font-size:12.5px; line-height:1.7; color:var(--tx2); }
  .gate ol b { color:var(--tx); }

  .note { font-size:11px; color:var(--mut); line-height:1.65; margin-top:11px; }
  .foot { margin-top:26px; padding-top:13px; border-top:1px solid var(--line); display:flex;
          justify-content:space-between; gap:10px; font-size:9px; color:var(--dim); letter-spacing:.8px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
           background:var(--a); color:#0C0B0B; font-size:11.5px; font-weight:700; padding:10px 18px;
           border-radius:20px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; }
  .toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

let logs = {};

function save() { try { localStorage.setItem(KEY, JSON.stringify(logs)); } catch(e) {} badge(); }
function badge() {
  const b = document.getElementById("savebadge");
  if (!b) return;
  b.textContent = "SAVED"; b.style.color = "var(--a)";
  setTimeout(() => { b.textContent = logLabel(); b.style.color = ""; }, 1300);
}
function gateWeek() {
  var ws = Object.keys(logs).map(Number).filter(function(n){ return logs[n] && logs[n].gate === "clear"; });
  return ws.length ? Math.min.apply(null, ws) : 0;
}
function phaseAt(d) {
  if (d < PHASES[0].from) return PHASES[0];
  return PHASES.find(function(p){ return d >= p.from && d < p.to; }) || NEXT;
}
function refDate(n) {                        // the current week reads today's date; any other week reads its Wednesday
  if (n === currentWeek()) return new Date();
  return new Date(START.getFullYear(), START.getMonth(), START.getDate() + (n - 1) * 7 + 2);
}
function phaseFor(n) {                       // gate cleared -> HOLD from the following week (travel + Florida keep their own targets)
  var p = phaseAt(refDate(n)), g = gateWeek();
  if (g && n > g && !p.fixed && p !== NEXT) return HOLD;
  return p;
}
function currentWeek() {
  const n = new Date();                      // count calendar days, so the Nov 1 clock change can't shift the week
  const days = Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(START.getFullYear(), START.getMonth(), START.getDate())) / 864e5);
  return Math.min(Math.max(Math.floor(days / 7) + 1, 1), WEEKS.length);
}
let wk = currentWeek();
let tab = "today";
const dayName = () => ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];
function sessionsFor(n) {                    // travel weeks: the trip's sessions plus whichever home days fall in that week
  const W = WEEKS[n-1];
  if (!W.home) return SESSIONS;
  const home = SESSIONS.filter(s => W.home.includes(s.k));
  return W.homeFirst ? home.concat(TRAVEL) : TRAVEL.concat(home);
}
const countLogged = () => sessionsFor(wk).filter(s => logs[wk] && logs[wk][s.k] && logs[wk][s.k].a).length;
const logLabel = () => countLogged() + "/" + sessionsFor(wk).length + " LOGGED";

function fuelCard(d) {                      // what to eat today, keyed to the real date; nothing on the trip or after the block

  if (day === D(11,17).getTime())      t = "<b>Tonight: carb-heavy dinner</b>, because tomorrow is the 10K. Rice, pasta or potatoes; go easy on fat and fibre.";

  else if (wd === 0) t = "<b>Tonight: make dinner the carb meal.</b> It's what fuels Monday's Upper A.";
  else if (wd === 1) t = "<b>Before Upper A: ~300 cal of carbs</b> (toast and honey, a banana, a bagel). Then 35–40 g of protein within an hour or two of finishing.";
  else if (wd === 2) t = "<b>Tonight: put more of the day's carbs into dinner</b> for tomorrow's long run.";
  else if (wd === 3) t = "<b>Before the run: ~200–300 cal of carbs</b> 60–90 min before, plus a glass of water. Nothing needed during.";
  if (d >= D(11,6) && d < D(11,24) && (wd === 1 || wd === 3 || wd === 5))

/* ============================ RENDER ============================ */
function trendHTML() {
  const rows = Object.entries(logs).filter(e => e[1] && (e[1].weight || e[1].waist)).sort((a,b) => +a[0] - +b[0]);
  if (rows.length < 2) return "";
  const delta = (cur, prev, fastAt, dp) => {
    const d = parseFloat(cur) - parseFloat(prev);
    if (isNaN(d)) return "";
    const cls = d > 0 ? "up" : (fastAt !== null && d < -fastAt ? "fast" : "dn");
    return `<span class="delta ${cls}">${d > 0 ? "+" : ""}${d.toFixed(dp)}</span>`;
  };
  let out = `<div class="trend"><div class="slab">TREND · THU AM</div>` +
    `<div class="trow mono" style="color:var(--mut)"><span>WEEK</span><span>WEIGHT · WAIST</span></div>`;
  let lastW = null, lastWa = null;
  rows.forEach(r => {
    const v = r[1];
    const w  = v.weight ? `${esc(v.weight)} lb ${lastW !== null ? delta(v.weight, lastW, 1.2, 1) : ""}` : "—";
    const wa = v.waist  ? `${esc(v.waist)}" ${lastWa !== null ? delta(v.waist, lastWa, null, 2) : ""}` : "—";
    if (v.weight) lastW = v.weight;
    if (v.waist) lastWa = v.waist;
    out += `<div class="trow mono"><span>WK ${r[0]} · ${WEEKS[r[0]-1] ? WEEKS[r[0]-1].dates : ""}</span><span>${w} · ${wa}</span></div>`;
  });
  return out + `<div class="note">Red weight = faster than 1.2 lb/wk, a tripwire. Waist dropping while weight holds = losing fat and keeping muscle — that counts.</div></div>`;
}

function render(scroll) {
  if (scroll === undefined) scroll = true;

  let body = "";

  if (tab === "today") {
    if (trip) {
      body = `<div class="slab">${today.toUpperCase()} · ON THE ROAD · WEEK ${wk}</div>
        <div class="card key"><div class="slab">CALIFORNIA · HOW THE TRIP WORKS</div><div class="plan" style="color:var(--tx2);font-size:12.5px">${TRAVEL_HOW}</div></div>` +
        TRAVEL.map(S => sessionCard(S, week, true)).join("");
    } else {
      body = `<div class="slab">${today.toUpperCase()} · WEEK ${wk}</div>` + fuelCard(now) +
        (phaseAt(now) === PHASES[4] ? `<div class="card key"><div class="slab">FLORIDA · DEC 17 – JAN 5</div><div class="plan" style="color:var(--tx2);font-size:12.5px">
          <b>About one session a day</b>, picked from the home week: the four lifts first (Upper A, Hips + Posterior, Upper B, Hard Legs), runs or tennis on the other days. <b>~2,300, protein 150+.</b> Weigh Thursdays: the first week can read up to 3 lb high from water. After that, more than 3 lb over your Dec 17 weight → ~2,100 until it's back. Export a backup on Jan 5 and send it before the January cut.</div></div>` : "") +
        TODAY_MAP[today].map(k => sessionCard(SESSIONS.find(s => s.k === k), week, true)).join("");
      if (today === "Thu") body += weighCard(week, "today");
    }
  }

  if (tab === "log") {
    body = sessionsFor(wk).map(S => sessionCard(S, week, false)).join("") + weighCard(week, "log");
    if (wk >= 5) {
      const g = (logs[wk] && logs[wk].gate) || "";
      body += `<div class="card key"><div class="slab">THE GATE · ABS CHECK</div>
        <div class="sub">Morning, fasted, flat overhead light, relaxed — not flexed, not pumped.</div>
        <select id="gate-sel" onchange="setWeek('gate',this.value);save();render(false)">
          <option value=""${g===""?" selected":""}>— not checked this week —</option>
          <option value="no"${g==="no"?" selected":""}>Not yet</option>
          <option value="close"${g==="close"?" selected":""}>Close — top four, lower two soft</option>
          <option value="clear"${g==="clear"?" selected":""}>CLEARED — lower abs + serratus at rest</option>
        </select>
        ${g==="clear" ? `<div class="note" style="color:var(--a)">Gate cleared. Stop cutting: HOLD from next week, 2,250 for seven days, then 2,350. California still runs as planned, and Dec 4–16 becomes HOLD instead of a cut. Don't finish the calendar.</div>` : ""}</div>`;
    }
    body += trendHTML() +
      `<button class="btn primary" onclick="exportData()">EXPORT BACKUP — COPY + FILE</button>
       <textarea id="importbox" rows="2" placeholder="Paste a backup here to restore…"></textarea>
       <button class="btn" onclick="importData()">RESTORE FROM BACKUP</button>
       <div class="note">Export every Thursday after the weigh-in. Save the file to iCloud Drive when the share sheet opens, or paste the JSON to Claude to sync it.</div>`;
  }

  if (tab === "runs") {
    body = `<div class="card key"><div class="slab">${week.ql || "MON PM · QUALITY"}</div><div class="plan">${week.q}</div>${afterNote("monQ", week)}</div>
      <div class="card key"><div class="slab">${week.ll || "WED AM · LONG — THE PRIORITY"}</div><div class="plan">${week.l}</div>${afterNote("wedL", week)}</div>
      ${week.trip ? `<div class="card"><div class="slab">CALIFORNIA · THE REST OF THE CARDIO</div><div class="plan" style="color:var(--tx2)">Walking is the cardio on the trip. No incline sessions, and nothing added to make up for a big dinner. The easy run is an optional extra, not a quota.</div></div>` : ""}
      <div class="card"><div class="slab">THU · BIKE COMMUTE</div><div class="plan" style="color:var(--tx2)">${CARDIO.thuB}</div></div>
      <div class="card"><div class="slab">THE REST OF THE CARDIO — CAPPED${week.trip ? " · HOME DAYS" : ""}</div>
        <div class="liftrow"><span class="n">Tue incline walk</span><span class="s mono">20–25 min</span></div>
        <div class="liftrow"><span class="n">Fri incline walk <em>(tennis 60 if it comes back)</em></span><span class="s mono">45 min</span></div>
        <div class="liftrow"><span class="n">Sat incline walk <em>(tennis 60–90 if it comes back)</em></span><span class="s mono">60 min</span></div>
        <div class="liftrow"><span class="n">Sun walk</span><span class="s mono">30–60 min</span></div></div>
      <div class="card"><div class="slab">SHOES · BRINGING IN THE EVO SL</div>
        <div class="liftrow"><span class="n">Before Mon Nov 9: wear them around for an hour or two</span><span class="s mono">fit check</span></div>
        <div class="liftrow"><span class="n">Mon Nov 9 · intervals</span><span class="s mono">Evo SL</span></div>
        <div class="liftrow"><span class="n">Wed Nov 11 · 9K</span><span class="s mono">Pegasus</span></div>
        <div class="liftrow"><span class="n">Mon Nov 16 · intervals</span><span class="s mono">Evo SL</span></div>
        <div class="liftrow"><span class="n">Wed Nov 18 · 10K</span><span class="s mono">Pegasus</span></div>
        <div class="liftrow"><span class="n">California · if the first two felt good</span><span class="s mono">pack Evo SL</span></div>
        <div class="liftrow"><span class="n">December on · Mon intervals + shorter Weds</span><span class="s mono">Evo SL</span></div>
        <div class="liftrow"><span class="n">December on · longest runs</span><span class="s mono">Pegasus</span></div>
        <div class="note">Lower heel than the Pegasus (roughly 6 vs 10 mm), so more work goes to the calves and Achilles. Tight calves the next day is normal. A sore Achilles, or knee pain in a new spot → back to the Pegasus for a week.</div></div>
      <div class="card key"><div class="slab">GOAL · EASY 10K BY WED NOV 18</div>
        <div class="plan" style="color:var(--tx2)"><b>Distance, not pace.</b> Wednesdays build 8K (Nov 4) → 9K (Nov 11) → 10K (Nov 18), all conversational. It's your last long run before California. No gels or bottle needed for an hour in November; eat beforehand. <b>8K sub-45 already done:</b> 44:43 on Oct 28. <b>Monday intervals:</b> comfortably hard, never all-out; you should be able to say a few words at the end of each rep. <b>Wednesday:</b> long and slow, conversational the whole way. Easy running at two runs a week doesn't cost you muscle; the lifting and protein are what protect it.</div></div>
      <div class="note">If the week collapses, drop Monday's quality run. Never Wednesday. Physio stretches: block C after Monday's run, block B after Wednesday's.</div>`;
  }

  if (tab === "lifts") {
    body = [["MON","mon"],["TUE","tue"],["THU","thu"],["FRI","fri"]].map(d =>
      `<details><summary><span><span class="mono daytag">${d[0]}</span><span style="font-size:14px;font-weight:600">${LIFTS[d[1]].t}</span></span>
        <span class="mono" style="font-size:10px;color:var(--dim)">${LIFTS[d[1]].i.length}</span></summary>
        <div class="dbody"><div class="sub" style="padding:7px 0">${LIFTS[d[1]].s}</div>${liftRows(d[1])}</div></details>`).join("") +
      `<details open><summary><span><span class="mono daytag">SAT</span><span style="font-size:14px;font-weight:600">Calisthenics</span></span>
        <span class="mono" style="font-size:10px;color:var(--dim)">WK ${wk}</span></summary>
        <div class="dbody"><div class="sub" style="padding:7px 0">Skills first, while fresh · switch weeks above to scout ahead</div>${
          week.c.split(" · ").map(x => `<div class="liftrow"><span class="n">${x}</span></div>`).join("")
        }</div></details>
      <details${(week.trip || trip) ? " open" : ""}><summary><span><span class="mono daytag">CA</span><span style="font-size:14px;font-weight:600">California · Nov 24 – Dec 3</span></span>
        <span class="mono" style="font-size:10px;color:var(--dim)">A/B</span></summary>
        <div class="dbody"><div class="plan" style="color:var(--tx2);font-size:12.5px;padding:9px 0 4px">${TRAVEL_HOW}</div>
          <div style="margin-top:12px">${travelHTML("A")}</div>
          <div style="margin-top:16px">${travelHTML("B")}</div>
          <div class="sub" style="margin-top:14px;color:var(--a)">RUNS</div><div class="plan" style="color:var(--tx2);font-size:12.5px">${TRAVEL_RUNS} Long downhills load the kneecap more.</div></div></details>
      <div class="card key"><div class="slab">PHYSIO PROGRAM v2 — HIPS & KNEE · SPLIT, NOT DAILY</div>
        <div class="sub">Oct 30 review: getting better. IT band still tight, hip flexors still weak, not flexible enough yet. The plan is strengthening the muscles around the knee to take load off the joint. <b style="color:var(--tx2)">Follow-up: Sat Dec 5.</b></div>
        <div class="sub" style="margin-top:8px;color:var(--a)">A · ACTIVATION — before Tue &amp; Fri legs (~10 min)</div>
        <div class="sub" style="margin:2px 0 0">Tuesday</div>
        <div class="liftrow"><span class="n">Prone hip abduction</span><span class="s mono">2×10 each · 3s</span></div>
        <div class="liftrow swap"><span class="n">Band side walk, legs straight — band just above the knees, toes forward, hips level</span><span class="s mono">2×10 steps each way</span></div>
        <div class="liftrow swap"><span class="n">Diagonal hip extension, banded — kick back and out at 45°, squeeze the glute, no back arch</span><span class="s mono">2×10 each</span></div>
        <div class="liftrow swap"><span class="n">Side-step shuffle + mini squat between 2 cones, alternate lead leg</span><span class="s mono">2×10</span></div>
        <div class="liftrow"><span class="n">Squat with band, knees pushing out</span><span class="s mono">2×10 · 3s</span></div>
        <div class="sub" style="margin:8px 0 0">Friday</div>
        <div class="liftrow"><span class="n">Clamshell, banded</span><span class="s mono">2×10 each · 3s</span></div>
        <div class="liftrow"><span class="n">Band side walk, legs straight</span><span class="s mono">2×10 steps each way</span></div>
        <div class="liftrow"><span class="n">Balance, standing, cycling leg</span><span class="s mono">2×20 each</span></div>
        <div class="liftrow"><span class="n">Diagonal hip extension, banded</span><span class="s mono">2×10 each</span></div>
        <div class="liftrow"><span class="n">Squat with band, knees pushing out</span><span class="s mono">2×10 · 3s</span></div>
        <div class="sub" style="margin-top:10px;color:var(--a)">B · STRETCH: IT BAND + QUADS — after Tue &amp; Fri legs and the Wed run (~6 min; she wrote 2 rounds for the IT band and quad, so do a second when you have time)</div>
        <div class="liftrow swap"><span class="n">IT band, lying — knee across the body with the opposite hand, shoulders down</span><span class="s mono">R ×4 · L ×2 · 20s</span></div>
        <div class="liftrow"><span class="n">Standing side-bend, legs crossed, arm overhead</span><span class="s mono">R ×4 · L ×2 · 20s</span></div>
        <div class="liftrow swap"><span class="n">Quad, face down with a strap — hips pressed into the floor, stop short of knee pain</span><span class="s mono">R ×4 · L ×2 · 20s</span></div>
        <div class="sub" style="margin-top:10px;color:var(--a)">C · STRETCH: HIPS + GLUTES — after the Mon run, Thu upper and Sat calisthenics (~6 min)</div>
        <div class="liftrow"><span class="n">Hip flexor, block — tuck pelvis under, squeeze back-leg glute, then lean; reach same-side arm up</span><span class="s mono">R ×4 · L ×2 · 20s</span></div>
        <div class="liftrow"><span class="n">Figure-4, lying</span><span class="s mono">R ×4 · L ×2 · 20s</span></div>
        <div class="liftrow"><span class="n">Cross-body piriformis, lying</span><span class="s mono">R ×4 · L ×2 · 20s</span></div>
        <div class="sub" style="margin-top:10px;color:var(--a)">D · HOME STRENGTH — Sunday (~12 min)</div>
        <div class="liftrow"><span class="n">Clamshell, banded</span><span class="s mono">2×10 each · 3s</span></div>
        <div class="liftrow"><span class="n">Prone hip abduction</span><span class="s mono">2×10 each · 3s</span></div>
        <div class="liftrow"><span class="n">Supine banded leg press</span><span class="s mono">2×10 each · 3s</span></div>
        <div class="liftrow"><span class="n">Balance, standing, cycling leg</span><span class="s mono">2×20 each</span></div>
        <div class="liftrow"><span class="n">Side-step shuffle + mini squat</span><span class="s mono">2×10</span></div>
        <div class="note">All 14 of her exercises, split so no slot runs past ~12 min. Every strengthening exercise except the banded leg press lands twice a week, because strengthening is what actually takes load off the knee. Stretching runs alongside it: B three times a week, C three, for about 4–5 min per muscle per week. The IT band itself barely stretches; these work on the hip muscles that pull on it. Right side gets the extra reps because it's the tight side. <b style="color:var(--tx2)">This split is mine, not hers:</b> send it to her through PhysiApp and adjust to whatever she says.</div></div>
      <div class="card"><div class="slab">CORE CIRCUIT — THE ×3</div>
        <div class="liftrow"><span class="n">Med ball overhead crunch</span><span class="s mono">12–15</span></div>
        <div class="liftrow"><span class="n">Reverse crunch</span><span class="s mono">12–15</span></div>
        <div class="liftrow"><span class="n">Russian twist, med ball</span><span class="s mono">10–12 ea</span></div>
        <div class="liftrow"><span class="n">Dead bug</span><span class="s mono">30s</span></div>
        <div class="note">45s between rounds. The dead bugs feed the L-sit — don't rush them.</div></div>
      <div class="card"><div class="slab">HANDSTAND</div>
        <div class="plan" style="color:var(--tx2)"><b>Handstand is a 10-minute opener, not a session.</b> Wall only, while fresh, and it's optional. Once a week won't build a freestanding handstand and you said that's fine — aesthetics is the goal here. The core stability you actually wanted is already coming from cable crunches, hanging leg raises, woodchops and the L-sit. If you ever do want the handstand for real, one session with a coach will do more than three months of solo attempts.</div></div>`;
  }

  if (tab === "rules") {
    body = `<div class="gate"><div class="slab" style="color:var(--a)">THE GATE — WHAT ENDS THIS BLOCK</div>
        <div class="plan" style="color:var(--tx2)">Not a date. Checked every Thursday from week 7, morning, fasted, flat overhead light, relaxed:</div>
        <ol><li><b>Lower two abs visible</b> — not just the top four</li>
            <li><b>Serratus visible at rest</b></li>
            <li><b>Weight around 151–152 or lower</b>, as a sanity check: if the photos clearly say yes at 152, the photos win</li></ol>
        <div class="note">All three land → stop cutting that week and go to HOLD. <b style="color:var(--tx)">Hard floor: 148 lb.</b> Below that at 6'0 you're trading the physique for a smaller copy of it. If the gate hasn't cleared at 149, the answer is more muscle — not less food.<br><br>Realistically the gate clears late December or in January, not before the trip. Not cleared by Thu Nov 19? Nothing gets forced. The cut picks up again Dec 4–16, and January carries on from there.</div></div>
      <div class="card"><div class="slab">TRIPWIRES — ANY ONE AND CALORIES GO +150/DAY, SAME DAY</div>
        ${WIRES.map(w => `<div class="wire">${w}</div>`).join("")}
        <div class="note">No debate, no waiting a week to see. You have a documented history of under-eating relative to your activity and the hot flashes last block were the receipt.</div></div>
      <div class="card"><div class="slab">TEN RULES — SO YOU DON'T END UP SKINNY</div>
        ${RULES.map((r,i) => `<div class="rule"><div class="num anton">${i+1}</div><div class="txt"><b>${r[0]}</b> ${r[1]}</div></div>`).join("")}</div>
      <div class="card"><div class="slab">FUEL — FULL MAP</div>
        ${PHASES.concat([HOLD]).map(p => `<div class="liftrow"><span class="n">${p.id ? "Phase " + p.id + " · " : "If the gate clears · "}${p.name} <span style="color:var(--dim)">${p.span}</span></span>
          <span class="s mono">${p.map || (p.cal + " / " + p.rest)}</span></div>`).join("")}
        <div class="note">Training day / Sunday unless the row says otherwise. Right now: <b style="color:var(--tx2)">${phase.mac}</b> · ${phase.rate}.<br>
        <b style="color:var(--tx2)">Nov 5:</b> 155.1 → 152.6 in two weeks (1.25 lb/wk) tripped the rate rule. Middle ground until the trip: 2,100 / 1,900 plus 150 of carbs on the three hardest days (Mon intervals, Wed long run, Fri legs), ~450 a week. Full +150 every day if Nov 12 drops another 1.2+ lb or a lift falls two weeks running. That pace also says maintenance may be higher than below; recheck Nov 19 before setting the California and Florida numbers.<br><br>Weeks 1–4 at ~2,300 actual held the scale flat (155.4 → 156.3), so maintenance on a full home week is ~2,300–2,400, well under the ~2,725 the formula and Garmin suggested. 2,100 / 1,900 averages ~2,070. The three-week trend (0.6 lb/wk) says that's a ~300/day deficit; the faster two-week drop (156.3 → 154.0) includes water leaving after the deload week. Waist 30.7" → 30.3". Recheck after Nov 19 with four more Thursdays.<br><br>
        <b style="color:var(--tx2)">Travel burns less.</b> The California program is ~250/day less training than a home week, so maintenance on the road is ~2,100–2,200, and closer to 2,350 on a 15k+ step day. That's why the break is ~2,200, not 2,350. A diet break means eating at maintenance; the extra carbs still refill you.<br><br>
        <b style="color:var(--tx2)">Florida</b> is about one session a day, also less than home, so ~2,300 is at or just above maintenance. The Thursday weigh-in decides: more than 3 lb over your Dec 17 weight after the first week → ~2,100 until it's back.<br><br>Fat sits at 27% of calories — inside the 15–30% band, with carbs taking the rest. Sunday: P165 · C185 · F56.<br><br>Protein is above 1 g/lb on purpose. Requirement scales with LEAN mass, not bodyweight, and rises in a deficit: 165g = 2.7 g/kg LBM, mid-range of the 2.3–3.1 recommended for lean athletes cutting. It stays 165 all the way down — your lean mass isn't supposed to change, so neither does the number.<br><br>Totals come first; timing is a small edge on top. Putting ~150g of the day's carbs in the meals before and after training fuels the sessions, and it may feel better than a big late dinner, but the daily numbers are what decide the result.</div></div>`;
  }

  document.getElementById("app").innerHTML = `
    <div class="mast">
      <div class="top">
        <div class="wordmark anton">Ax.Q4</div>
        <div class="wk"><div class="n anton mono">${wk}</div><div class="d mono">${week.dates.toUpperCase()}</div></div>
      </div>
      <div class="strip mono"><span>NO DAYS WASTED</span><span class="r">${phase.id ? "PHASE " + phase.id + " · " : ""}${phase.name}${week.down ? " · DELOAD" : ""}${(phase === HOLD && gateWeek()) ? " · GATE WK" + gateWeek() : ""}</span></div>
    </div>
    <div class="fuel">
      ${(() => { const h = phase.hard && wk === currentWeek() && phase.hard.days.includes(now.getDay()) ? phase.hard : null;
        return `<div><div class="lab mono">${h ? h.l1 : (phase.l1 || "TRAINING DAY")}</div><div class="v anton mono">${h ? h.cal : phase.cal}</div><div class="s mono">${h ? h.mac : phase.mac}</div></div>`; })()}
      <div><div class="lab mono">${phase.l2 || "SUNDAY"}</div><div class="v anton mono">${phase.rest}</div><div class="s mono">${phase.rate}</div></div>
    </div>
    <div class="dots">${WEEKS.map(w => {
      const has = logs[w.num] && Object.keys(logs[w.num]).length;
      return `<button class="mono ${w.num===wk?"on":""} ${has?"has":""}" onclick="wk=${w.num};render()">${w.num}</button>`;
    }).join("")}</div>
    <div class="focus">${week.f}</div>
    <div class="tabs">${[["today","today"],["log","log"],["runs","runs"],["lifts","lifts"],["rules","rules"]].map(t =>
      `<button class="mono ${tab===t[0]?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>
    ${body}
    <div class="foot mono"><span id="savebadge">${logLabel()}</span><span>155.5 → THE GATE · ABS, NOT A DATE</span></div>`;
  if (scroll) window.scrollTo(0, 0);
}
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
