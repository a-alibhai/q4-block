<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0C0B0B">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0C0B0B; --card:#161313; --card2:#110F0F; --line:#241F1F; --line2:#332C2C;
    --tx:#F0EDE6; --tx2:#B5ADA7; --mut:#7A716B; --dim:#4A4341;
    --a:#FF4FA3; --on:#46D08A; --warn:#F5A524; --stop:#FF5A47;
    color-scheme: dark;
  }
  body.ph3 { --a:#5EEAD4; }
  body {
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px; max-width:480px; margin:0 auto;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 60px);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .mono { font-family:'SF Mono',ui-monospace,'Roboto Mono',monospace; font-variant-numeric:tabular-nums; }
  .anton { font-family:'Anton','Haettenschweiler','Arial Narrow',sans-serif; font-weight:400; letter-spacing:.5px; }

  /* ---- masthead: the bib ---- */
  .mast { border:1px solid var(--line2); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .mast .top { padding:14px 16px 12px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .wordmark { font-size:38px; line-height:.88; transform:skewX(11deg); transform-origin:left bottom;
              text-transform:uppercase; color:var(--tx); }
  .mast .wk { text-align:right; flex-shrink:0; }
  .mast .wk .n { font-size:34px; line-height:.9; color:var(--a); }
  .mast .wk .d { font-size:9.5px; letter-spacing:1.4px; color:var(--mut); margin-top:4px; }
  .strip { background:var(--a); color:#0C0B0B; padding:7px 16px; display:flex; justify-content:space-between;
           align-items:center; font-size:10px; font-weight:700; letter-spacing:1.6px; }
  .strip .r { opacity:.72; }

  /* ---- fuel bar ---- */
  .fuel { display:flex; gap:8px; margin-bottom:12px; }
  .fuel > div { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  .fuel .lab { font-size:8.5px; letter-spacing:1.4px; color:var(--mut); font-weight:700; margin-bottom:3px; }
  .fuel .v { font-size:15px; color:var(--a); }
  .fuel .s { font-size:10.5px; color:var(--tx2); margin-top:2px; }

  /* ---- week dots ---- */
  .dots { display:flex; gap:5px; overflow-x:auto; padding-bottom:5px; margin-bottom:12px; scrollbar-width:none; }
  .dots::-webkit-scrollbar { display:none; }
  .dots button { min-width:34px; height:34px; flex-shrink:0; border-radius:8px; border:1px solid var(--line2);
                 background:var(--card); color:var(--mut); font-size:12px; font-weight:700; }
  .dots button.has { color:var(--a); border-color:color-mix(in srgb, var(--a) 45%, transparent); }
  .dots button.on { background:var(--a); color:#0C0B0B; border-color:var(--a); }

  .focus { border-left:3px solid var(--a); border-radius:0 10px 10px 0; padding:11px 14px; margin-bottom:16px;
           font-size:12.5px; line-height:1.6; color:var(--tx2);
           background:linear-gradient(100deg, color-mix(in srgb, var(--a) 9%, transparent), transparent 70%); }

  /* ---- tabs ---- */
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tabs button { flex:1; padding:10px 0 8px; background:none; border:none; color:#5B5350;
                 font-size:10px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase;
                 border-bottom:2px solid transparent; }
  .tabs button.on { color:var(--tx); border-bottom-color:var(--a); }

  /* ---- cards ---- */
  .card { background:var(--card); border-radius:12px; padding:13px 15px; margin-bottom:10px;
          border-left:3px solid var(--line2); }
  .card.done { border-left-color:var(--a); }
  .card.key { border-left-color:var(--a); }
  .slab { font-size:9.5px; letter-spacing:1.5px; color:var(--mut); font-weight:700; margin-bottom:7px; }
  .card.done .slab { color:var(--a); }
  .plan { font-size:13.5px; line-height:1.6; }
  .sub { font-size:11px; color:var(--mut); line-height:1.5; margin-bottom:6px; }
  .ttl { font-size:15px; font-weight:700; margin-bottom:5px; }

  input, textarea, select { width:100%; background:var(--bg); border:1px solid var(--line2); border-radius:8px;
          color:var(--tx); padding:10px 11px; font-size:16px; font-family:inherit; margin-top:7px;
          -webkit-appearance:none; appearance:none; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--a); }
  select { background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
           background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }

  .liftrow { display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:12.5px;
             border-bottom:1px solid var(--line); }
  .liftrow:last-child { border-bottom:none; }
  .liftrow .n { color:var(--tx2); }
  .liftrow .s { font-size:11px; color:var(--a); white-space:nowrap; }
  .liftrow.swap .n::after { content:' NEW'; font-size:8px; letter-spacing:1px; color:var(--a);
             border:1px solid var(--a); border-radius:3px; padding:1px 3px; margin-left:6px; vertical-align:2px; }

  details { margin-bottom:9px; }
  summary { list-style:none; background:var(--card); border-radius:10px; padding:12px 15px;
            border:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  summary::-webkit-details-marker { display:none; }
  details[open] summary { border-radius:10px 10px 0 0; border-bottom:none; }
  .dbody { background:var(--card2); border-radius:0 0 10px 10px; padding:4px 15px 10px;
           border:1px solid var(--line); border-top:none; }
  .daytag { font-size:9.5px; color:var(--a); font-weight:700; letter-spacing:1.2px; margin-right:10px; }

  .btn { display:block; width:100%; padding:13px; border-radius:10px; border:1px solid var(--line2);
         background:var(--card); color:var(--tx); font-size:12px; font-weight:700; letter-spacing:1.2px; margin-top:10px; }
  .btn.primary { background:var(--a); color:#0C0B0B; border-color:var(--a); }

  .trend { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:12px; }
  .trow { display:flex; justify-content:space-between; font-size:12px; padding:4px 0; color:var(--tx2); }
  .trow .delta { font-size:11px; }
  .dn { color:var(--on); } .up { color:var(--warn); } .fast { color:var(--stop); }

  .rule { display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); }
  .rule:last-child { border-bottom:none; }
  .rule .num { font-size:17px; color:var(--a); line-height:1; flex-shrink:0; width:24px; }
  .rule .txt { font-size:12.5px; line-height:1.62; color:var(--tx2); }
  .rule .txt b { color:var(--tx); font-weight:700; }

  .wire { display:flex; gap:10px; align-items:flex-start; padding:9px 0; font-size:12.5px;
          line-height:1.55; color:var(--tx2); border-bottom:1px solid var(--line); }
  .wire:last-child { border-bottom:none; }
  .wire::before { content:''; width:7px; height:7px; border-radius:2px; background:var(--stop);
                  flex-shrink:0; margin-top:6px; }

  .gate { border:1px solid var(--a); border-left-width:3px; border-radius:12px; padding:13px 15px; margin-bottom:10px;
          background:linear-gradient(100deg, color-mix(in srgb, var(--a) 8%, transparent), transparent 70%); }
  .gate ol { margin:8px 0 0 18px; font-size:12.5px; line-height:1.7; color:var(--tx2); }
  .gate ol b { color:var(--tx); }

  .note { font-size:11px; color:var(--mut); line-height:1.65; margin-top:11px; }
  .foot { margin-top:26px; padding-top:13px; border-top:1px solid var(--line); display:flex;
          justify-content:space-between; gap:10px; font-size:9px; color:var(--dim); letter-spacing:.8px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
           background:var(--a); color:#0C0B0B; font-size:11.5px; font-weight:700; padding:10px 18px;
           border-radius:20px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9; }
  .toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast mono" id="toast"></div>
<script>
/* ============================ BLOCK DATA ============================ */
const BLOCK = "Q4 Sep21-Dec13 2026";
const START = new Date(2026, 8, 21);           // Mon Sep 21 2026
const KEY   = "axq4block_v1";

const PHASES = [
  { id:1, name:"CUT",    weeks:[1,2,3,4,5,6],  cal:"2,400", rest:"2,125", mac:"P165 · C273 · F72", rate:"0.7 lb/wk" },
  { id:2, name:"FINISH", weeks:[7,8,9,10],     cal:"2,500", rest:"2,250", mac:"P165 · C290 · F75", rate:"0.5 lb/wk" },
  { id:3, name:"HOLD",   weeks:[11,12],        cal:"2,600→2,750", rest:"same", mac:"P175 · C320 · F80", rate:"flat" },
];

const WEEKS = [
 { num:1, dates:"Sep 21–27", tgt:"155.5",
   q:"5 min easy → 6× (1 min hard / 90s easy) → 3 min easy. 23 min total.",
   l:"6K easy, conversational. Leave the clock alone.",
   c:"Handstand wall opener 10 min (optional) · Weighted Dips 3×6-8 · Weighted Pull-ups 3×6-8 · L-sit on parallettes 4× max hold · Core circuit ×3",
   f:"Week 1 is baselines, not PRs. Log every working weight — week 4 needs something to beat. Your lifts come back before they go up; that's detraining resolving, not muscle returning." },
 { num:2, dates:"Sep 28–Oct 4", tgt:"154.8",
   q:"4 min easy → 5× (3 min @ 5:25–5:35 / 90s easy) → 3 min easy. 30 min total.",
   l:"6.5K easy.",
   c:"HS opener 10 min · Dips +2.5 if wk1 was clean · Pull-ups 3×6-8 · L-sit 4× max · Core circuit ×3",
   f:"First real read on the rate. One weigh-in tells you nothing — you need three. Keep eating 2,400 even if week 1's number looked dramatic." },
 { num:3, dates:"Oct 5–11", tgt:"154.0",
   q:"4 min easy → 5× (3 min @ 5:25 / 90s easy) → 3 min easy. 30 min total.",
   l:"7K easy.",
   c:"HS opener · Dips 3×6-8 · Pull-ups +2.5 if clean · L-sit 4× max, one-leg extensions · Core circuit ×3",
   f:"Lifts should be back at or above your late-July numbers by the end of this week. If they aren't, that's a tripwire, not a motivation problem. Add the 150." },
 { num:4, dates:"Oct 12–18", tgt:"153.3", down:true,
   q:"20 min easy, no intervals. 20 min total.",
   l:"6K easy.",
   c:"Deload: hold the same weights, cut one set from dips and pull-ups. Keep the L-sit work.",
   f:"DOWN WEEK — and it has to deload the lifting or it isn't one: drop the LAST set of every exercise on all four lifting days, keep the weights identical. Calories stay at 2,400; this is a recovery week, not a diet break. Expect a bigger-than-usual drop on Thursday as inflammation clears." },
 { num:5, dates:"Oct 19–25", tgt:"152.5",
   q:"4 min easy → 3× (5 min @ 5:30 / 2 min easy) → 3 min easy. 28 min total.",
   l:"7.5K easy.",
   c:"HS opener · Dips 3×6-8 · Pull-ups 3×6-8 · L-sit 4× max · Core circuit ×3",
   f:"Halfway. First honest ab check: Thursday AM, flat overhead light, relaxed, not flexed. Photo it. Don't judge it in a gym mirror after a pump." },
 { num:6, dates:"Oct 26–Nov 1", tgt:"151.8",
   q:"4 min easy → 2× (10 min @ 5:35 / 2 min easy) → 3 min easy. Race-pace rehearsal. 29 min total.",
   l:"8K easy. First 8K of the block — any pace, just finish it.",
   c:"HS opener · Dips 3×6-8 · Pull-ups 3×6-8 · L-sit 4× max · Core circuit ×3",
   f:"Last week at 2,400. Thursday's number is your Phase 2 starting weight — take it seriously." },
 { num:7, dates:"Nov 2–8", tgt:"151.2", key:true,
   q:"3 min easy → 22 min continuous tempo @ 5:40 → 3 min easy. 28 min total.",
   l:"7K easy. Keep the legs fresh for next week.",
   c:"HS opener · Dips 3×6-8 · Pull-ups 3×6-8 · L-sit 4× max · Core circuit ×3",
   f:"PHASE 2. Calories go UP to 2,500 and the rate slows to 0.5 lb/wk. This is deliberate — the last layer comes off slowest and costs the most muscle. THE GATE OPENS: check it every Thursday from here." },
 { num:8, dates:"Nov 9–15", tgt:"150.7", key:true,
   q:"Easy 20 min shakeout. Nothing hard. 20 min total.",
   l:"8K TIME TRIAL — target sub-45 (5:37/km). Out at 5:45, negative split the back half.",
   c:"HS opener · Dips 3×6-8 · Pull-ups 3×6-8 · L-sit 4× max · Core circuit ×3",
   f:"8K attempt, Wednesday. You'll be the lightest you've ever raced, and lighter is faster — roughly 1% per 1% of bodyweight. Taper into it on the two days that matter: Monday is a shakeout, Tuesday is light, carbs the night before. Thursday onward is a normal week." },
 { num:9, dates:"Nov 16–22", tgt:"150.2",
   q:"4 min easy → 5× (3 min @ 5:15 / 90s easy) → 3 min easy. 30 min total.",
   l:"6.5K easy.",
   c:"HS opener · Dips 3×6-8 · Pull-ups 3×6-8 · L-sit 4× max · Core circuit ×3",
   f:"~150 territory. Check the gate Thursday. If it clears, you're done — move to HOLD that week. Do not ride it out just because the calendar says week 10." },
 { num:10, dates:"Nov 23–29", tgt:"149.7",
   q:"3 min easy → 22 min tempo → 3 min easy. 28 min total.",
   l:"8K — consolidation, or your re-attempt if week 8 missed. Slightly quicker than week 8's opening pace.",
   c:"HS opener · Dips 3×6-8 · Pull-ups 3×6-8 · L-sit 4× max · Core circuit ×3",
   f:"Last scheduled cut week. If the gate still hasn't cleared, move to HOLD anyway — the answer at 149 is more muscle, not less food. That's next block's job." },
 { num:11, dates:"Nov 30–Dec 6", tgt:"151",
   q:"4 min easy → 5× (3 min @ 5:15 / 90s easy) → 3 min easy. 30 min total.",
   l:"7K easy.",
   c:"Back to full volume: third set returns on dips and pull-ups. Push the weighted work.",
   f:"REVERSE: 2,600. The scale goes up 2–3 lb in ten days. It is water and glycogen, exactly like early August. You have seen this movie. Do not react to it." },
 { num:12, dates:"Dec 7–13", tgt:"152",
   q:"3 min easy → 24 min continuous tempo → 3 min easy. 30 min total.",
   l:"8K steady.",
   c:"Full volume. Test: best L-sit and best weighted dip on film.",
   f:"2,725 = maintenance, and you hold here. Thursday: final weigh-in and photos in the same light as September. Then the lean-gain block starts — +0.25–0.4 lb/wk, and you stay lean the whole way." },
];

const LIFTS = {
  mon:{ t:"Upper A", s:"Chest-led · condo gym", i:[
    ["Incline Bench Press","2×6-8","40 ea"],["Pec Deck","2×8-10","140"],["Cable Lat Raise","2×8-10","5"],
    ["Weighted Pull-ups","2×6-8","+6"],["Machine Row (elbows flared)","2×6-8","140"],["Face Pulls","2×8-10","12"],
    ["Incline DB Curl","2×8-10","17.5 ea",1],["Tricep SA Press-down","2×6-8","9"]] },
  tue:{ t:"Posterior + Abs", s:"Tuesday gym · barbell, DB, cable only", i:[
    ["Barbell RDL","3×6-8","45 ea"],["Cable Pull-Through","2-3×10-12","~40"],["Split Squats","2×8-10","45 ea"],
    ["Abductor OR Adductor (alt wkly)","2×8-10","100/90"],["Cable Crunch — progress this","3×10-12","16+"],
    ["Hanging Leg Raises","2×10-15","BW"]] },
  thu:{ t:"Upper B", s:"Back-led · lat-biased SA row (elbow tucked, pull to hip)", i:[
    ["Wide Grip Lat Pulldown","3×8-10","120"],["SA Row (lat-biased)","2×10-12","60"],["DB Bench Press","2×6-8","60 ea"],
    ["Upper Chest Cable Fly","2×10-12","7"],["DB Shoulder Press","2×8-10","40"],["Side Lat Raises","2×10-15",""],
    ["Machine Rear Delt Fly","2×12-15",""],["Overhead Tricep Ext","2×6-8","12"],["Rope Hammer Curl","2×6-8","14"]] },
  fri:{ t:"Hard Legs", s:"Friday gym · tennis in the AM = autoregulate, don't skip", i:[
    ["Squats","3×4-6","50 ea → 55+"],["Pendulum Squat","2×8-10","80"],["Leg Curl","2×10-12","115"],
    ["SL Leg Extension","2×10-15","55 ea"],["Standing Calf Raises","3×10-15","175"],["Woodchoppers / Pallof","2×10-12",""]] },
};

const CARDIO = {
  tueW:"Incline walk, 20–25 min. Cap it there — this is digestion and steps, not a fat-loss tool.",
  thuB:"Bike commute, 15 min each way. That's your third cardio session; no separate run needed.",
  friX:"Tennis 60 min, or 45 min incline walk. One or the other, never both.",
  satX:"Tennis 60–90 min, or 45–60 min incline walk.",
  sunW:"Fasted walk 30–60 min outside. Then genuinely rest — no 'easy' session that turns into a session.",
};

const SESSIONS = [
  { k:"monU", lab:"Mon · Upper A",          lift:"mon" },
  { k:"monQ", lab:"Mon · Quality Run",      get:w=>w.q },
  { k:"tueL", lab:"Tue · Posterior + Abs",  lift:"tue" },
  { k:"tueW", lab:"Tue · Incline Walk",     txt:CARDIO.tueW },
  { k:"wedL", lab:"Wed · Long Run",         get:w=>w.l },
  { k:"thuU", lab:"Thu · Upper B",          lift:"thu" },
  { k:"thuB", lab:"Thu · Bike Commute",     txt:CARDIO.thuB },
  { k:"friX", lab:"Fri · Tennis / Incline", txt:CARDIO.friX },
  { k:"friL", lab:"Fri · Hard Legs",        lift:"fri" },
  { k:"satX", lab:"Sat · Tennis / Incline", txt:CARDIO.satX },
  { k:"satC", lab:"Sat · Calisthenics",     get:w=>w.c },
  { k:"sunW", lab:"Sun · Walk + Rest",      txt:CARDIO.sunW },
];
const TODAY_MAP = { Mon:["monU","monQ"], Tue:["tueL","tueW"], Wed:["wedL"], Thu:["thuU","thuB"],
                    Fri:["friX","friL"], Sat:["satX","satC"], Sun:["sunW"] };

const RULES = [
 ["Protein never moves.","<b>165g every day</b> — training days, rest days, restaurants, travel. It is the single biggest lever you have for holding muscle in a deficit. Two days under 150g in a week and the week failed, whatever the calorie total said."],
 ["Load is not negotiable. Volume is.","What keeps muscle on you in a deficit is <b>heavy top sets</b>. If a session has to be short, cut the last accessory. Never drop the working weight on squats, incline, DB bench, pull-ups or RDL to make a session easier."],
 ["The deficit comes from food, not cardio.","Cardio is fixed at what's in this plan. <b>Never add a run, a walk, or 15 more minutes of incline to make up for a meal.</b> Stacking cardio onto a deficit is the most reliable way to end up skinny instead of lean — it eats recovery, not just fat."],
 ["Never skip Friday legs.","It is the first session people quietly drop in a cut, and quads are where visible size goes first. <b>Tennis is not a leg day.</b> If you played in the morning, autoregulate the weight — don't cancel the session."],
 ["Judge on three-week trends and Thursday photos.","One weigh-in is noise. One bad session is noise. <b>Nothing changes on a single data point</b>, in either direction."],
 ["Creatine, 5g, every day.","Cheapest performance insurance there is in a deficit, and the one supplement with real evidence behind it. Timing is irrelevant — just don't miss days."],
 ["Sleep 7h+.","Under-sleeping in a deficit shifts <b>what</b> you lose toward lean mass rather than fat. That's a measured effect, not a wellness line. On a week where sleep collapses, eat at maintenance instead of pushing the deficit."],
 ["Fuel the session; don't fuss over pre-workout protein.","<b>Carbs before an early lift are the part that matters</b> — your ~200 cal is what keeps the top sets alive in a deficit. Protein timing around training is a minor variable next to the daily total; 165g across 3–4 feedings covers it. The one thing worth doing: <b>35–40g within an hour or two of finishing</b>, so the overnight gap doesn't stretch to lunch."],
 ["Four or more days off-plan is a maintenance week.","Not a failure. Eat 2,725, keep lifting, resume the cut after. <b>Never try to make up a deficit</b> — that's how a good block turns into a crash."],
 ["Photos beat the mirror and the scale.","Thursday AM, same spot, same light, same relaxed pose. At this body fat the mirror lies in both directions depending on the hour, the light and what you ate."],
];

const WIRES = [
 "Any main lift down two weeks in a row",
 "More than 1.2 lb/week averaged across two weeks",
 "Overheating or hot flashes return — your personal early-warning sign from the last block",
 "Two runs in a row fall apart at paces you held the week before",
 "Waking up unrested three or more mornings in a week",
];

/* ============================ STATE ============================ */
let logs = {};
try { logs = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { logs = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(logs)); } catch(e) {} badge(); }
function badge() {
  const b = document.getElementById("savebadge");
  if (!b) return;
  b.textContent = "SAVED"; b.style.color = "var(--a)";
  setTimeout(() => { b.textContent = countLogged() + "/12 LOGGED"; b.style.color = ""; }, 1300);
}
function gateWeek() {
  var ws = Object.keys(logs).map(Number).filter(function(n){ return logs[n] && logs[n].gate === "clear"; });
  return ws.length ? Math.min.apply(null, ws) : 0;
}
function phaseFor(n) {                       // gate cleared -> HOLD from the following week
  var g = gateWeek();
  if (g && n > g) return PHASES[2];
  return PHASES.find(function(p){ return p.weeks.includes(n); }) || PHASES[2];
}
function currentWeek() {
  const d = Math.floor((Date.now() - START.getTime()) / 6048e5);
  return Math.min(Math.max(d + 1, 1), 12);
}
let wk = currentWeek();
let tab = "today";
const dayName = () => ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date().getDay()];
const countLogged = () => SESSIONS.filter(s => logs[wk] && logs[wk][s.k] && logs[wk][s.k].a).length;

/* ============================ HELPERS ============================ */
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function setField(sk, f, v) { logs[wk] = logs[wk] || {}; logs[wk][sk] = logs[wk][sk] || {}; logs[wk][sk][f] = v; }
function setWeek(f, v) { logs[wk] = logs[wk] || {}; logs[wk][f] = v; }

function liftRows(k) {
  return LIFTS[k].i.map(r => `<div class="liftrow${r[3]?" swap":""}"><span class="n">${r[0]}</span>` +
    `<span class="s mono">${r[1]}${r[2] ? " · " + r[2] : ""}</span></div>`).join("");
}
function planHTML(S, week) {
  if (S.lift) return `<div class="ttl">${LIFTS[S.lift].t}</div><div class="sub">${LIFTS[S.lift].s}</div>${liftRows(S.lift)}`;
  if (S.txt)  return `<div class="plan" style="color:var(--tx2)">${S.txt}</div>`;
  const v = S.get(week);
  if (S.k === "satC") return `<div class="sub">Skills first, while fresh · progression changes weekly</div>` +
    v.split(" · ").map(x => `<div class="liftrow"><span class="n">${x}</span></div>`).join("");
  return `<div class="plan">${v}</div>`;
}
function fieldsHTML(sk) {
  const v = (logs[wk] && logs[wk][sk]) || {};
  return `<input id="f-${sk}-a" placeholder="Actual — what you did" value="${esc(v.a)}"
      oninput="setField('${sk}','a',this.value)" onchange="save()" onblur="save();render(false)">
    <input id="f-${sk}-n" placeholder="Notes — how it felt" value="${esc(v.n)}"
      oninput="setField('${sk}','n',this.value)" onchange="save()" onblur="save();render(false)">`;
}
function sessionCard(S, week, withPlan) {
  const done = (logs[wk] && logs[wk][S.k] && logs[wk][S.k].a) ? " done" : "";
  return `<div class="card${done}"><div class="slab">${S.lab.toUpperCase()}${done ? " · ✓" : ""}</div>` +
    (withPlan ? planHTML(S, week) : `<div class="sub">${S.lift ? LIFTS[S.lift].s : (S.txt ? S.txt.split(".")[0] + "." : S.get(week))}</div>`) +
    fieldsHTML(S.k) + `</div>`;
}

/* ============================ EXPORT / IMPORT ============================ */
function exportData() {
  const payload = JSON.stringify({ exported:new Date().toISOString(), block:BLOCK, logs }, null, 2);
  if (navigator.clipboard) navigator.clipboard.writeText(payload).catch(()=>{});
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload], { type:"application/json" }));
    a.download = "axq4-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
  } catch(e) {}
  toast("Copied + file saved");
}
function importData() {
  const t = document.getElementById("importbox").value.trim();
  if (!t) { toast("Paste a backup first"); return; }
  try { const p = JSON.parse(t); logs = p.logs || p; save(); render(); toast("Backup restored"); }
  catch(e) { toast("That isn't valid JSON"); }
}
function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1800);
}

/* ============================ RENDER ============================ */
function trendHTML() {
  const rows = Object.entries(logs).filter(e => e[1] && e[1].weight).sort((a,b) => +a[0] - +b[0]);
  if (rows.length < 2) return "";
  let out = `<div class="trend"><div class="slab">WEIGHT TREND · THU AM</div>`;
  rows.forEach((r, i) => {
    let d = "", cls = "";
    if (i > 0) {
      const diff = parseFloat(r[1].weight) - parseFloat(rows[i-1][1].weight);
      if (!isNaN(diff)) {
        cls = diff > 0 ? "up" : (diff < -1.2 ? "fast" : "dn");
        d = (diff > 0 ? "+" : "") + diff.toFixed(1);
      }
    }
    out += `<div class="trow mono"><span>WK ${r[0]} · ${WEEKS[r[0]-1] ? WEEKS[r[0]-1].dates : ""}</span>` +
           `<span>${esc(r[1].weight)} lb <span class="delta ${cls}">${d}</span></span></div>`;
  });
  return out + `<div class="note">Red means faster than 1.2 lb — that's a tripwire, add 150 cal/day.</div></div>`;
}

function render(scroll) {
  if (scroll === undefined) scroll = true;
  const week = WEEKS[wk-1], phase = phaseFor(wk), today = dayName();
  document.body.className = phase.id === 3 ? "ph3" : "";

  let body = "";

  if (tab === "today") {
    body = `<div class="slab">${today.toUpperCase()} · WEEK ${wk}</div>` +
      TODAY_MAP[today].map(k => sessionCard(SESSIONS.find(s => s.k === k), week, true)).join("");
    if (today === "Thu") body += `<div class="card key"><div class="slab">THURSDAY AM WEIGH-IN</div>
      <div class="sub">Wake, bathroom, weigh, before food or water. Same conditions every week. Then the photo.</div>
      <input id="w-today" inputmode="decimal" placeholder="Target ~${week.tgt} lb" value="${esc(logs[wk] && logs[wk].weight)}"
        oninput="setWeek('weight',this.value)" onchange="save()" onblur="save();render(false)"></div>`;
  }

  if (tab === "log") {
    body = SESSIONS.map(S => sessionCard(S, week, false)).join("") +
      `<div class="card key"><div class="slab">THURSDAY AM WEIGH-IN (LB)</div>
        <div class="sub">Target this week: ~${week.tgt} lb</div>
        <input id="w-log" inputmode="decimal" placeholder="e.g. 154.2" value="${esc(logs[wk] && logs[wk].weight)}"
          oninput="setWeek('weight',this.value)" onchange="save()" onblur="save();render(false)"></div>`;
    if (wk >= 5) {
      const g = (logs[wk] && logs[wk].gate) || "";
      body += `<div class="card key"><div class="slab">THE GATE · ABS CHECK</div>
        <div class="sub">Morning, fasted, flat overhead light, relaxed — not flexed, not pumped.</div>
        <select id="gate-sel" onchange="setWeek('gate',this.value);save();render(false)">
          <option value=""${g===""?" selected":""}>— not checked this week —</option>
          <option value="no"${g==="no"?" selected":""}>Not yet</option>
          <option value="close"${g==="close"?" selected":""}>Close — top four, lower two soft</option>
          <option value="clear"${g==="clear"?" selected":""}>CLEARED — lower abs + serratus at rest</option>
        </select>
        ${g==="clear" ? `<div class="note" style="color:var(--a)">Gate cleared. Stop cutting. Go to HOLD next week: 2,600 for seven days, then 2,725. Don't finish the calendar.</div>` : ""}</div>`;
    }
    body += trendHTML() +
      `<button class="btn primary" onclick="exportData()">EXPORT BACKUP — COPY + FILE</button>
       <textarea id="importbox" rows="2" placeholder="Paste a backup here to restore…"></textarea>
       <button class="btn" onclick="importData()">RESTORE FROM BACKUP</button>
       <div class="note">Export every Thursday after the weigh-in. Save the file to iCloud Drive when the share sheet opens, or paste the JSON to Claude to sync it.</div>`;
  }

  if (tab === "runs") {
    body = `<div class="card key"><div class="slab">MON PM · QUALITY</div><div class="plan">${week.q}</div></div>
      <div class="card key"><div class="slab">WED AM · LONG — THE PRIORITY</div><div class="plan">${week.l}</div></div>
      <div class="card"><div class="slab">THU · BIKE COMMUTE</div><div class="plan" style="color:var(--tx2)">${CARDIO.thuB}</div></div>
      <div class="card"><div class="slab">THE REST OF THE CARDIO — CAPPED</div>
        <div class="liftrow"><span class="n">Tue incline walk</span><span class="s mono">20–25 min</span></div>
        <div class="liftrow"><span class="n">Fri tennis <em>or</em> incline</span><span class="s mono">60 / 45 min</span></div>
        <div class="liftrow"><span class="n">Sat tennis <em>or</em> incline</span><span class="s mono">60–90 / 45–60 min</span></div>
        <div class="liftrow"><span class="n">Sun walk</span><span class="s mono">30–60 min</span></div></div>
      <div class="card"><div class="slab">8K TARGET · SUB-45</div>
        <div class="plan" style="color:var(--tx2)">45:00 over 8K is <b>5:37/km</b>. Your last logged 6K was 5:46/km, so the gap is nine seconds a kilometre — and you'll be five pounds lighter by the attempt. Time trial is week 8, re-run week 10 if you miss it.</div></div>
      <div class="note">If the week collapses, drop Monday's quality run. Never Wednesday.</div>`;
  }

  if (tab === "lifts") {
    body = [["MON","mon"],["TUE","tue"],["THU","thu"],["FRI","fri"]].map(d =>
      `<details><summary><span><span class="mono daytag">${d[0]}</span><span style="font-size:14px;font-weight:600">${LIFTS[d[1]].t}</span></span>
        <span class="mono" style="font-size:10px;color:var(--dim)">${LIFTS[d[1]].i.length}</span></summary>
        <div class="dbody"><div class="sub" style="padding:7px 0">${LIFTS[d[1]].s}</div>${liftRows(d[1])}</div></details>`).join("") +
      `<details open><summary><span><span class="mono daytag">SAT</span><span style="font-size:14px;font-weight:600">Calisthenics</span></span>
        <span class="mono" style="font-size:10px;color:var(--dim)">WK ${wk}</span></summary>
        <div class="dbody"><div class="sub" style="padding:7px 0">Skills first, while fresh · switch weeks above to scout ahead</div>${
          week.c.split(" · ").map(x => `<div class="liftrow"><span class="n">${x}</span></div>`).join("")
        }</div></details>
      <div class="card"><div class="slab">CORE CIRCUIT — THE ×3</div>
        <div class="liftrow"><span class="n">Med ball overhead crunch</span><span class="s mono">12–15</span></div>
        <div class="liftrow"><span class="n">Reverse crunch</span><span class="s mono">12–15</span></div>
        <div class="liftrow"><span class="n">Russian twist, med ball</span><span class="s mono">10–12 ea</span></div>
        <div class="liftrow"><span class="n">Dead bug</span><span class="s mono">30s</span></div>
        <div class="note">45s between rounds. The dead bugs feed the L-sit — don't rush them.</div></div>
      <div class="card"><div class="slab">TWO CHANGES FROM Q3</div>
        <div class="plan" style="color:var(--tx2)"><b>Incline DB curl</b> replaces the EZ preacher you lost. Same job — it loads the biceps hardest in the stretch — and it only needs an incline bench. Bayesian cable curl works too if the bench is taken.<br><br>
        <b>Handstand is a 10-minute opener, not a session.</b> Wall only, while fresh, and it's optional. Once a week won't build a freestanding handstand and you said that's fine — aesthetics is the goal here. The core stability you actually wanted is already coming from cable crunches, hanging leg raises, woodchops and the L-sit. If you ever do want the handstand for real, one session with a coach will do more than three months of solo attempts.</div></div>`;
  }

  if (tab === "rules") {
    body = `<div class="gate"><div class="slab" style="color:var(--a)">THE GATE — WHAT ENDS THIS BLOCK</div>
        <div class="plan" style="color:var(--tx2)">Not a date. Checked every Thursday from week 7, morning, fasted, flat overhead light, relaxed:</div>
        <ol><li><b>Lower two abs visible</b> — not just the top four</li>
            <li><b>Serratus visible at rest</b></li>
            <li><b>Weight at or under 151</b> and holding</li></ol>
        <div class="note">All three land → stop cutting that week and go to HOLD. <b style="color:var(--tx)">Hard floor: 148 lb.</b> Below that at 6'0 you're trading the physique for a smaller copy of it. If the gate hasn't cleared at 149, the answer is more muscle — not less food.</div></div>
      <div class="card"><div class="slab">TRIPWIRES — ANY ONE AND CALORIES GO +150/DAY, SAME DAY</div>
        ${WIRES.map(w => `<div class="wire">${w}</div>`).join("")}
        <div class="note">No debate, no waiting a week to see. You have a documented history of under-eating relative to your activity and the hot flashes last block were the receipt.</div></div>
      <div class="card"><div class="slab">TEN RULES — SO YOU DON'T END UP SKINNY</div>
        ${RULES.map((r,i) => `<div class="rule"><div class="num anton">${i+1}</div><div class="txt"><b>${r[0]}</b> ${r[1]}</div></div>`).join("")}</div>
      <div class="card"><div class="slab">FUEL — FULL MAP</div>
        ${PHASES.map(p => `<div class="liftrow"><span class="n">Phase ${p.id} · ${p.name} <span style="color:var(--dim)">wk ${p.weeks[0]}–${p.weeks[p.weeks.length-1]}</span></span>
          <span class="s mono">${p.cal} / ${p.rest}</span></div>`).join("")}
        <div class="note">Training day / Sunday. Macros this phase: <b style="color:var(--tx2)">${phase.mac}</b>. Target rate: ${phase.rate}.<br>
        Maintenance is ~2,725 — back-calculated from your own weigh-ins, not a calculator. Phase 1 averages ~2,360 across the week, a ~365/day deficit. Re-measure at week 3: intake + (weekly lb change × 500) = your real number.<br><br>Fat sits at 27% of calories — inside the 15–30% band, with carbs taking the rest. Sunday: P165 · C220 · F64.<br><br>Protein is above 1 g/lb on purpose. Requirement scales with LEAN mass, not bodyweight, and rises in a deficit: 165g = 2.7 g/kg LBM, mid-range of the 2.3–3.1 recommended for lean athletes cutting. It stays 165 all the way down — your lean mass isn't supposed to change, so neither does the number.<br><br>Timing beats totals: put ~150g of the day's carbs in the meal before and the meal after training, and take the rest out of the evening. Same number on the label, fuel where it does work, less food sitting on you at night.</div></div>`;
  }

  document.getElementById("app").innerHTML = `
    <div class="mast">
      <div class="top">
        <div class="wordmark anton">Ax.Q4</div>
        <div class="wk"><div class="n anton mono">${wk}</div><div class="d mono">${week.dates.toUpperCase()}</div></div>
      </div>
      <div class="strip mono"><span>NO DAYS WASTED</span><span class="r">PHASE ${phase.id} · ${phase.name}${week.down ? " · DELOAD" : ""}${(gateWeek() && wk > gateWeek()) ? " · GATE WK" + gateWeek() : ""}</span></div>
    </div>
    <div class="fuel">
      <div><div class="lab mono">TRAINING DAY</div><div class="v anton mono">${phase.cal}</div><div class="s mono">${phase.mac}</div></div>
      <div><div class="lab mono">SUNDAY</div><div class="v anton mono">${phase.rest}</div><div class="s mono">${phase.rate}</div></div>
    </div>
    <div class="dots">${WEEKS.map(w => {
      const has = logs[w.num] && Object.keys(logs[w.num]).length;
      return `<button class="mono ${w.num===wk?"on":""} ${has?"has":""}" onclick="wk=${w.num};render()">${w.num}</button>`;
    }).join("")}</div>
    <div class="focus">${week.f}</div>
    <div class="tabs">${[["today","today"],["log","log"],["runs","runs"],["lifts","lifts"],["rules","rules"]].map(t =>
      `<button class="mono ${tab===t[0]?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>
    ${body}
    <div class="foot mono"><span id="savebadge">${countLogged()}/12 LOGGED</span><span>155.5 → ~150 · ABS, NOT A DATE</span></div>`;
  if (scroll) window.scrollTo(0, 0);
}
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
